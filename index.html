<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechabellum Hits-to-Kill Matrix</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --good-pole: #2a78d6;
    --bad-pole: #e34948;
    --neutral-mid: #f0efec;
    --btn-bg: #ffffff;
    --btn-border: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --good-pole: #3987e5;
      --bad-pole: #e66767;
      --neutral-mid: #383835;
      --btn-bg: #232322;
      --btn-border: #383835;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 24px 48px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }

  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 20px; max-width: 70ch; line-height: 1.5; }

  .lang-switcher { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }
  .lang-icon { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; cursor: pointer; }
  #lang-select {
    font: inherit; font-size: 0.72rem; font-weight: 500;
    padding: 4px 22px 4px 8px; border-radius: 6px; max-width: 110px;
    border: 1px solid var(--btn-border); background: var(--btn-bg);
    color: var(--text-primary); cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%2352514e' d='M4 6l4 4 4-4z'/></svg>");
    background-repeat: no-repeat; background-position: right 6px center;
  }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .control-group h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 0 0 8px; font-weight: 600;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.toggle {
    font: inherit; font-size: 0.85rem; font-weight: 500;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--btn-border); background: var(--btn-bg);
    color: var(--text-primary); cursor: pointer;
    transition: background-color 120ms, color 120ms, border-color 120ms;
  }
  button.toggle:hover { border-color: var(--text-secondary); }
  button.toggle[aria-pressed="true"].atk { background: var(--good-pole); border-color: var(--good-pole); color: #fff; }
  button.toggle[aria-pressed="true"].hp { background: var(--bad-pole); border-color: var(--bad-pole); color: #fff; }

  .summary { margin-left: auto; text-align: right; font-size: 0.85rem; color: var(--text-secondary); }
  .summary strong { color: var(--text-primary); }

  .legend { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 0.8rem; color: var(--text-secondary); flex-wrap: wrap; }
  .legend-scale { display: flex; height: 12px; width: 180px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .legend-scale div { flex: 1; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: middle; border: 1px solid var(--border); }
  .legend-na { background: repeating-linear-gradient(45deg, var(--gridline), var(--gridline) 3px, transparent 3px, transparent 6px); }

  .matrix-shell {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-height: 78vh;
  }
  table.matrix { border-collapse: separate; border-spacing: 0; font-size: 0.78rem; }
  table.matrix th, table.matrix td {
    border-right: 1px solid var(--gridline);
    border-bottom: 1px solid var(--gridline);
    padding: 0;
  }
  th.corner {
    position: sticky; top: 0; left: 0; z-index: 3;
    background: var(--surface-1); min-width: 130px;
  }
  th.col-head {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-1);
    width: 40px; height: 165px; padding: 4px 0 8px; vertical-align: bottom;
  }
  th.col-head span {
    writing-mode: vertical-rl; transform: rotate(180deg);
    white-space: nowrap; font-weight: 500; color: var(--text-secondary);
    display: inline-block; padding: 0 2px;
  }
  th.row-head {
    position: sticky; left: 0; z-index: 1;
    background: var(--surface-1);
    text-align: right; padding: 6px 12px 6px 0;
    font-weight: 500; color: var(--text-secondary); white-space: nowrap;
    min-width: 130px;
  }
  th.row-head, th.corner { border-right: 1px solid var(--gridline); }
  tr.hover-row th.row-head, tr.hover-row td { background-color: color-mix(in srgb, var(--text-secondary) 6%, transparent); }

  td.cell {
    width: 40px; height: 26px; text-align: center;
    font-variant-numeric: tabular-nums; cursor: default;
    color: var(--text-primary);
  }
  td.cell.dark-text { color: #ffffff; }
  td.cell.na { color: var(--text-muted); background: repeating-linear-gradient(45deg, var(--gridline), var(--gridline) 3px, transparent 3px, transparent 6px); }
  td.cell.self { color: var(--text-muted); }
  td.cell:hover, td.cell:focus { outline: 2px solid var(--text-primary); outline-offset: -2px; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 0.8rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    max-width: 260px; display: none; line-height: 1.5;
  }
  #tooltip .tt-title { font-weight: 600; margin-bottom: 4px; }
  #tooltip .tt-value { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  #tooltip .tt-row { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <h1 id="page-title"></h1>
    <div class="lang-switcher" id="lang-switcher">
      <label for="lang-select" class="lang-icon">A/文</label>
      <select id="lang-select"></select>
    </div>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="panel controls">
    <div class="control-group">
      <h2 id="heading-atk"></h2>
      <div class="btn-row">
        <button class="toggle atk" data-upg="atk1" aria-pressed="false"></button>
        <button class="toggle atk" data-upg="atk2" aria-pressed="false"></button>
        <button class="toggle atk" data-upg="specAtk" aria-pressed="false"></button>
      </div>
    </div>
    <div class="control-group">
      <h2 id="heading-hp"></h2>
      <div class="btn-row">
        <button class="toggle hp" data-upg="hp1" aria-pressed="false"></button>
        <button class="toggle hp" data-upg="hp2" aria-pressed="false"></button>
        <button class="toggle hp" data-upg="specHp" aria-pressed="false"></button>
      </div>
    </div>
    <div class="summary">
      <span id="label-your-atk"></span> <strong id="atk-pct">+0%</strong><br>
      <span id="label-opponent-hp"></span> <strong id="hp-pct">+0%</strong>
    </div>
    <div class="legend" style="width:100%;">
      <span id="legend-fewer"></span>
      <span class="legend-scale">
        <div style="background:var(--good-pole)"></div>
        <div style="background:color-mix(in srgb, var(--good-pole) 45%, var(--neutral-mid))"></div>
        <div style="background:var(--neutral-mid)"></div>
        <div style="background:color-mix(in srgb, var(--bad-pole) 45%, var(--neutral-mid))"></div>
        <div style="background:var(--bad-pole)"></div>
      </span>
      <span id="legend-more"></span>
      <span style="margin-left:16px;"><span class="legend-swatch legend-na"></span> <span id="legend-na"></span></span>
    </div>
  </div>

  <div class="matrix-shell" id="matrix-shell">
    <table class="matrix" id="matrix"></table>
  </div>
</div>

<div id="tooltip"></div>

  return u.names[currentLang] || u.names[0];

    opponentHp: 'PW przeciwnika:',
    fewerHitsNeeded: 'Potrzeba mniej trafień',
    moreHitsNeeded: 'Potrzeba więcej trafień',
    cantTarget: 'brak celu',
    attackerDefender: 'Atakujący \\ Broniący',
    langSwitcherTitle: 'Język nazw jednostek',
    hitsLabel: '{0} traf.',
    sameAsBaseline: 'tak samo jak bazowo',
    vsBaseline: '{0} względem bazowego',
    baseParen: '(baza {0})',
    atkVsHp: 'ATK {0} vs PW {1}',
    overkillLine: 'Nadmiarowe obrażenia: {0} ({1}% ciosu dobijającego)',
  },
};

function t(key, ...args) {
  const code = LANGUAGES[currentLang] ? LANGUAGES[currentLang].code : 'en';
  const dict = UI_STRINGS[code] || UI_STRINGS.en;
  let str = dict[key] || UI_STRINGS.en[key] || key;
  args.forEach((a, i) => { str = str.replace(`{${i}}`, a); });
  return str;
}

const BONUS = { atk1: 0.12, atk2: 0.24, specAtk: 0.30, hp1: 0.15, hp2: 0.30, specHp: 0.30 };
const REL_SCALE_CAP = 0.5; // relative delta magnitude that maps to full color intensity
const state = { atk1: false, atk2: false, specAtk: false, hp1: false, hp2: false, specHp: false };

// Tier-2 tech upgrades require their tier-1 prerequisite: picking atk2/hp2
// auto-enables atk1/hp1, and dropping atk1/hp1 auto-drops atk2/hp2. The
// Senior Specialist cards (specAtk/specHp) have no such dependency.
const REQUIRES = { atk2: 'atk1', hp2: 'hp1' };
const IMPLIES = { atk1: 'atk2', hp1: 'hp2' };

function setUpgrade(key, value) {
  state[key] = value;
  if (value && REQUIRES[key]) state[REQUIRES[key]] = true;
  if (!value && IMPLIES[key]) state[IMPLIES[key]] = false;
  document.querySelectorAll('button.toggle').forEach(btn => {
    btn.setAttribute('aria-pressed', String(state[btn.dataset.upg]));
  });
  render();
}

function canTarget(attacker, defender) {
  const t = attacker.target;
  if (!t || t === 'None') return false;
  if (t === 'Air & Ground') return true;
  if (t === 'Ground Only') return !defender.flying;
  if (t === 'Air Only') return defender.flying;
  return false;
}

function hitsToKill(atk, hp) {
  if (atk <= 0) return null;
  return Math.ceil(hp / atk);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return `rgb(${r}, ${g}, ${bl})`;
}

function currentVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function buildTable() {
  const table = document.getElementById('matrix');
  let html = `<thead><tr><th class="corner">${escapeHtml(t('attackerDefender'))}</th>`;
  for (const d of UNITS) {
    html += `<th class="col-head" data-col="${d.id}"><span>${escapeHtml(unitName(d))}</span></th>`;
  }
  html += '</tr></thead><tbody>';
  for (const a of UNITS) {
    html += `<tr data-row="${a.id}"><th class="row-head" data-row="${a.id}">${escapeHtml(unitName(a))}</th>`;
    for (const d of UNITS) {
      html += `<td class="cell" data-row="${a.id}" data-col="${d.id}"></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

function render() {
  const atkBonus = (state.atk1 ? BONUS.atk1 : 0) + (state.atk2 ? BONUS.atk2 : 0) + (state.specAtk ? BONUS.specAtk : 0);
  const hpBonus = (state.hp1 ? BONUS.hp1 : 0) + (state.hp2 ? BONUS.hp2 : 0) + (state.specHp ? BONUS.specHp : 0);
  document.getElementById('atk-pct').textContent = `+${Math.round(atkBonus * 100)}%`;
  document.getElementById('hp-pct').textContent = `+${Math.round(hpBonus * 100)}%`;

  const goodPole = currentVar('--good-pole');
  const badPole = currentVar('--bad-pole');
  const neutral = currentVar('--neutral-mid');

  for (const a of UNITS) {
    for (const d of UNITS) {
      const cell = document.querySelector(`td[data-row="${a.id}"][data-col="${d.id}"]`);
      const base = canTarget(a, d) ? hitsToKill(a.atk, d.hp) : null;
      cell.classList.remove('na', 'dark-text', 'self');
      cell.style.backgroundColor = '';

      if (base === null) {
        cell.classList.add('na');
        cell.textContent = '–';
        cell.removeAttribute('data-tt');
        continue;
      }

      const effAtk = a.atk * (1 + atkBonus);
      const effHp = d.hp * (1 + hpBonus);
      const hits = hitsToKill(effAtk, effHp);
      const delta = hits - base;
      cell.textContent = hits.toLocaleString();
      if (a.id === d.id) cell.classList.add('self');

      let t = 0, pole = null;
      if (delta !== 0) {
        t = Math.min(Math.abs(delta) / base / REL_SCALE_CAP, 1);
        pole = delta < 0 ? goodPole : badPole;
      }
      cell.style.backgroundColor = pole ? lerpColor(neutral, pole, t) : neutral;
      if (t > 0.55) cell.classList.add('dark-text');

      // Overkill: only the killing hit can ever be "wasted" -- every prior
      // hit lands on a defender still above zero, so it's fully used.
      const overkill = hits * effAtk - effHp;
      const overkillPct = (overkill / effAtk) * 100;

      cell.dataset.tt = JSON.stringify({
        aId: a.id, dId: d.id, hits, base, delta,
        effAtk: Math.round(effAtk * 10) / 10, effHp: Math.round(effHp * 10) / 10,
        overkill: Math.round(overkill * 10) / 10, overkillPct: Math.round(overkillPct * 10) / 10,
      });
    }
  }
}

const UPGRADE_BUTTON_LABELS = { atk1: 'atk1', atk2: 'atk2', specAtk: null, hp1: 'hp1', hp2: 'hp2', specHp: null };
const UPGRADE_BUTTON_PCT = { atk1: 12, atk2: 24, specAtk: 30, hp1: 15, hp2: 30, specHp: 30 };
const UPGRADE_BUTTON_PREREQ = { atk2: 'atk1', hp2: 'hp1' };

function applyUIStrings() {
  document.documentElement.lang = LANGUAGES[currentLang].code;
  document.title = t('pageTitle');
  document.getElementById('page-title').textContent = t('pageTitle');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('heading-atk').textContent = t('yourAttackUpgrades');
  document.getElementById('heading-hp').textContent = t('opponentHpUpgrades');
  document.getElementById('label-your-atk').textContent = t('yourAtk');
  document.getElementById('label-opponent-hp').textContent = t('opponentHp');
  document.getElementById('legend-fewer').textContent = t('fewerHitsNeeded');
  document.getElementById('legend-more').textContent = t('moreHitsNeeded');
  document.getElementById('legend-na').textContent = t('cantTarget');
  document.getElementById('lang-switcher').title = t('langSwitcherTitle');

  document.querySelectorAll('button.toggle').forEach((btn) => {
    const key = btn.dataset.upg;
    const termKey = UPGRADE_BUTTON_LABELS[key];
    const name = termKey ? upgradeTermName(termKey)
      : (key === 'specAtk' ? t('seniorAttackSpecialist') : t('seniorDefenseSpecialist'));
    btn.textContent = `${name} (+${UPGRADE_BUTTON_PCT[key]}%)`;
    const prereq = UPGRADE_BUTTON_PREREQ[key];
    if (prereq) {
      btn.title = t('requires', upgradeTermName(UPGRADE_BUTTON_LABELS[prereq]));
    } else {
      btn.removeAttribute('title');
    }
  });
}

function initToggles() {
  document.querySelectorAll('button.toggle').forEach(btn => {
    btn.addEventListener('click', () => setUpgrade(btn.dataset.upg, !state[btn.dataset.upg]));
  });
}

function initTooltip() {
  const tt = document.getElementById('tooltip');
  const shell = document.getElementById('matrix-shell');

  shell.addEventListener('pointerover', (e) => {
    const cell = e.target.closest('td.cell');
    if (!cell) return;
    document.querySelectorAll('tr.hover-row').forEach(r => r.classList.remove('hover-row'));
    cell.closest('tr').classList.add('hover-row');

    if (!cell.dataset.tt) { tt.style.display = 'none'; return; }
    const d = JSON.parse(cell.dataset.tt);
    const deltaStr = d.delta === 0 ? t('sameAsBaseline') : t('vsBaseline', d.delta > 0 ? `+${d.delta}` : d.delta);
    tt.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'tt-title';
    title.textContent = `${unitName(unitsById.get(d.aId))} → ${unitName(unitsById.get(d.dId))}`;
    const value = document.createElement('div');
    value.className = 'tt-value';
    value.textContent = t('hitsLabel', d.hits.toLocaleString());
    const deltaRow = document.createElement('div');
    deltaRow.className = 'tt-row';
    deltaRow.textContent = `${deltaStr} ${t('baseParen', d.base.toLocaleString())}`;
    const statsRow = document.createElement('div');
    statsRow.className = 'tt-row';
    statsRow.textContent = t('atkVsHp', d.effAtk.toLocaleString(), d.effHp.toLocaleString());
    const overkillRow = document.createElement('div');
    overkillRow.className = 'tt-row';
    overkillRow.textContent = t('overkillLine', d.overkill.toLocaleString(), d.overkillPct);
    tt.append(title, value, deltaRow, statsRow, overkillRow);
    tt.style.display = 'block';
  });

  shell.addEventListener('pointermove', (e) => {
    if (tt.style.display !== 'block') return;
    const pad = 16;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + 260 > window.innerWidth) x = e.clientX - 260 - pad;
    if (y + 120 > window.innerHeight) y = e.clientY - 120 - pad;
    tt.style.left = x + 'px';
    tt.style.top = y + 'px';
  });

  shell.addEventListener('pointerout', (e) => {
    if (e.target.closest('td.cell') && !e.relatedTarget?.closest('td.cell')) {
      tt.style.display = 'none';
      document.querySelectorAll('tr.hover-row').forEach(r => r.classList.remove('hover-row'));
    }
  });
}

// Matches a browser locale (e.g. "zh-TW", "es-MX", "pt") against the
// game's 11 languages, which is a coarser set than BCP-47 -- most codes
// match on base language alone, but Chinese and Spanish each have two
// regional variants in the game's list, so those need a region rule
// rather than a plain base-language match.
function matchLanguage(locale) {
  const lower = locale.toLowerCase();
  const [base, region] = lower.split('-');
  const byCode = (code) => LANGUAGES.findIndex((l) => l.code.toLowerCase() === code);

  let idx = byCode(lower);
  if (idx !== -1) return idx;

  if (base === 'zh') return byCode(region === 'tw' || region === 'hk' || region === 'mo' ? 'zh-tw' : 'zh-cn');
  if (base === 'es') return byCode(region === 'es' ? 'es-es' : 'es-us');

  return LANGUAGES.findIndex((l) => l.code.toLowerCase().split('-')[0] === base);
}

function detectLanguageIndex() {
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const pref of prefs) {
    const idx = matchLanguage(pref);
    if (idx !== -1) return idx;
  }
  return 0; // English
}

function initLanguageSelect() {
  const select = document.getElementById('lang-select');
  select.innerHTML = LANGUAGES.map((l, i) => `<option value="${i}">${escapeHtml(l.name)}</option>`).join('');

  let saved = null;
  try {
    const code = localStorage.getItem('mechabellum-lang');
    if (code) {
      const idx = LANGUAGES.findIndex((l) => l.code === code);
      if (idx !== -1) saved = idx;
    }
  } catch (err) { /* localStorage unavailable (private browsing, etc.) */ }

  currentLang = saved !== null ? saved : detectLanguageIndex();
  select.value = String(currentLang);

  select.addEventListener('change', () => {
    currentLang = Number(select.value);
    try { localStorage.setItem('mechabellum-lang', LANGUAGES[currentLang].code); } catch (err) { /* ignore */ }
    applyUIStrings();
    buildTable();
    render();
  });
}

async function init() {
  try {
    const res = await fetch('units_data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    LANGUAGES = data.languages;
    UNITS = data.units;
    UPGRADE_TERMS = data.upgradeTerms;
    unitsById = new Map(UNITS.map((u) => [u.id, u]));
  } catch (err) {
    document.getElementById('matrix-shell').innerHTML =
      '<p style="padding:24px;max-width:60ch;color:var(--text-secondary)">' +
      'Could not load <code>units_data.json</code> (' + err.message + '). If you\'re opening this ' +
      'file directly from disk, browsers block local fetches for security — serve it instead, e.g. ' +
      'run <code>python3 -m http.server</code> in this folder and open ' +
      '<code>http://localhost:8000/</code>. This works normally once hosted on GitHub Pages.</p>';
    return;
  }
  initLanguageSelect();
  applyUIStrings();
  buildTable();
  render();
  initToggles();
  initTooltip();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  }
}

init();
</script>
